[workspace]
resolver = "2"
members = ["crates/*"]
# GUI spikes are throwaway, standalone projects.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/freddyrosa16/rozu"
publish = false

[workspace.dependencies]
# Internal crates
rozu-activity = { path = "crates/rozu-activity" }
rozu-cli-providers = { path = "crates/rozu-cli-providers" }
rozu-core = { path = "crates/rozu-core" }
rozu-mcp = { path = "crates/rozu-mcp" }
rozu-providers = { path = "crates/rozu-providers" }
rozu-tools = { path = "crates/rozu-tools" }
rozu-pty = { path = "crates/rozu-pty" }
rozu-secrets = { path = "crates/rozu-secrets" }
rozu-store = { path = "crates/rozu-store" }

# External crates
alacritty_terminal = "0.26"
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
eventsource-stream = "0.2"
fastrand = "2"
futures = "0.3"
ignore = "0.4"
# keyring 3 (not 4): 4.x needs Rust 1.88 and reorganizes the store API.
keyring = "3.6"
libc = "0.2"
portable-pty = "0.9"
regex = "1.11"
# native-tls (Security.framework on macOS) instead of the rustls/aws-lc default, whose OpenSSL-style
# license cargo-deny would reject.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "native-tls",
    "stream",
    "system-proxy",
] }
rpassword = "7"
# Bundled SQLite (public domain) for the session index; no system library needed.
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
secrecy = "0.10"
signal-hook-registry = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.47", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Dev/test
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
wiremock = "0.6"
