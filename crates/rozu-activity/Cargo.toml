[package]
name = "rozu-activity"
description = "v7.4 activity indicator for rozu: one dotted ring with a symbol per state, its timeline and 2D projection, in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["core"]
# `from_agent_events` / `From<&AgentEvent>`. Off for GUI spikes that only want the orb.
core = ["dep:rozu-core"]

[dependencies]
rozu-core = { workspace = true, optional = true }
serde_json.workspace = true
