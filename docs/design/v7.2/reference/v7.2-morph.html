<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href="tokens.css"><link rel=stylesheet href="tokens-v4.css"><link rel=stylesheet href="tokens-v5.css"><link rel=stylesheet href="tokens-v7.css"><link rel=stylesheet href="v7.css">
<style>body{width:960px;height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}#big{width:280px;height:280px}
.pill{align-self:center;height:38px;font-size:15px}.cap{position:absolute;left:24px;top:18px;font:11px var(--font-mono);color:var(--text-muted)}</style></head>
<body data-theme="dark"><div class="cap" id="cap"></div><canvas id="big"></canvas>
<div class="pill" id="pill"><canvas id="small"></canvas><span class="l" id="lab"></span><span class="t" id="tm"></span></div>
<script src="v7.2-orb.js"></script><script>
const HOLD=1.4,tl=ORDER.map((s,i)=>({state:s,start:i*HOLD}));const STEP={thinking:1,notes:1,reading:2,searching:2,editing:3,running:4,waiting:4,done:5,error:4,offline:4};
function frame(T){drawOrb(document.getElementById('big'),tl,T);drawOrb(document.getElementById('small'),tl,T);
  let k=0;while(k+1<tl.length&&tl[k+1].start<=T)k++;const st=tl[k].state,S=STATES[st];const lab=document.getElementById('lab');lab.textContent=S.label;lab.className='l '+({warning:'warning',success:'success',danger:'danger'}[S.tone]||'');
  lab.style.opacity=Math.min(1,(T-tl[k].start)/.12); // 120ms label cross-fade
  const e=Math.floor(T)+3;document.getElementById('tm').textContent=(st==='done'?'42s':Math.floor(e/60)+':'+String(e%60).padStart(2,'0'))+' · '+STEP[st]+'/5';
  document.getElementById('cap').textContent=`rozu v7.2 · 3D dot orbs · 120 points · perspective + depth sort · morph 600ms · T=${T.toFixed(3)}s · ${document.body.dataset.theme}`}
const q=new URLSearchParams(location.search);document.body.dataset.theme=q.get('theme')||'dark';frame(+(q.get('T')||0));
</script></body></html>
