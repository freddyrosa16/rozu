const tl=[{orb:q.get('from')||'running',start:0},{orb:q.get('to')||'done',start:1}];
for(const t of [.9,1.05,1.15,1.25,1.4,1.6,1.9,2.4]){const c=document.createElement('canvas');document.body.appendChild(c);drawOrb(c,tl,t)}
